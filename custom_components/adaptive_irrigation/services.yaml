water_zone:
  name: Water Zone
  description: Manually water a zone for a specified duration.
  fields:
    zone_id:
      name: Zone ID
      description: The zone name as configured (e.g. "east").
      required: true
      selector:
        text:
    duration_minutes:
      name: Duration (minutes)
      description: How long to water.
      required: true
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

evaluate_now:
  name: Evaluate Now
  description: Force an immediate watering evaluation for a zone.
  fields:
    zone_id:
      name: Zone ID
      description: The zone name as configured.
      required: true
      selector:
        text:

force_calibration:
  name: Force Calibration Check
  description: >
    Manually trigger the calibration followup for a zone right now using the
    current soil reading. Use this after a manual watering run to immediately
    see whether the sensor detected a moisture rise. Check HA logs for the result.
  fields:
    zone_id:
      name: Zone ID
      description: The zone name as configured (e.g. "yard_west").
      required: true
      selector:
        text:

calibration_status:
  name: Calibration Status
  description: >
    Post a persistent notification with calibration debug info for all zones:
    current rate, source (Store vs RestoreEntity), current soil, last watering
    context, and a projected rate if the followup ran right now.
